name: Deploy Dev

on:
  push:
    branches: [dev]
    # Docs-only pushes (the orchestrator's STATE/plan/ledger commits) must not
    # restart dev mid-conversation (owner, 2026-09-25). No runtime file is
    # markdown — prompts live in .ts modules. A push touching code still deploys.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: bash /srv/docker/fitcoach/deploy/deploy.sh dev
